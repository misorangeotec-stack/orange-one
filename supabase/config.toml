# Minimal Supabase CLI config so `supabase functions deploy` can resolve the
# function under supabase/functions/. The remote project is targeted with
# `--project-ref <SUPABASE_PROJECT_REF>` (see supabase/functions/README.md).
project_id = "orange-one"

[functions.admin-users]
verify_jwt = true

# Business-card OCR/extraction (Claude vision). Called by the mobile Leads app
# with the anon apikey; no user login yet, so JWT verification is off.
[functions.extract-card]
verify_jwt = false

# Voice-note transcription (Deepgram nova-3) + Claude translate/analyze.
[functions.transcribe-voice]
verify_jwt = false

# CV/resume extraction (Claude) for the HR Recruitment FMS. Resumes are PII and the
# caller is always a signed-in portal user, so JWT verification stays ON.
[functions.parse-resume]
verify_jwt = true

# Mirror a synced lead into the "Leads DB" Google Sheet + Drive folders. Fired by a
# Postgres trigger on app_leads via pg_net; authed with an x-push-secret header
# (PUSH_GOOGLE_SECRET), so JWT verification is off.
[functions.push-to-google]
verify_jwt = false

# Live foreign-exchange rate (xe.com scrape + FX-API fallback) for the Import
# Purchase FMS. The caller is always a signed-in portal user, so JWT stays ON.
[functions.import-fx-rate]
verify_jwt = true

# Receivables AI analysis (Claude) for the Top-Exposure report's Analysis tab. Receives a
# pre-computed stats summary (no DB reads) and returns a collections narrative. Sensitive
# figures + always a signed-in admin, so JWT verification stays ON.
[functions.analyze-receivables]
verify_jwt = true

# JD parsing (Claude) for the HR Recruitment FMS. A job description carries the salary
# band and the headcount, so JWT verification stays ON. (It already is — this block only
# stops that depending on the platform default.)
[functions.parse-jd]
verify_jwt = true

# Computes one person's work queue with the app's own logic, and queues the daily
# personal snapshot mail. Two callers with two credentials: pg_cron posts an
# `x-dispatch-secret` header (EMAIL_DISPATCH_SECRET) and has no JWT to offer, and
# the admin screen posts a signed-in user's JWT. So platform verification is OFF
# and the function checks BOTH itself — the same arrangement as send-email.
# Deploy with --no-verify-jwt.
[functions.work-snapshot]
verify_jwt = false

# AI fit scoring (Claude) for the HR Recruitment FMS. Reads a candidate's CV out of the
# PRIVATE fms-hr-docs bucket using the CALLER'S OWN JWT — the function holds no
# service-role key, so every read is gated by the same RLS the CV tab is gated by.
# Resumes are PII and the answer paraphrases one, so JWT verification is mandatory.
[functions.score-candidate]
verify_jwt = true

# Renders and sends every outbound mail in the portal — the FMS step alerts, the
# daily digests, the receivables reports. Two callers with two credentials, exactly
# as work-snapshot above: pg_cron / the GitHub Actions runner post an
# `x-dispatch-secret` header (EMAIL_DISPATCH_SECRET) with no JWT to offer, and the
# admin screens post a signed-in user's JWT. So platform verification is OFF and the
# function checks BOTH itself.
# ⚠ This block was ADDED LATER than the function. It was deployed --no-verify-jwt
#   from the start; without the block the CLI would default to ON and every cron
#   send would start failing 401. Deploy with --no-verify-jwt if in any doubt.
[functions.send-email]
verify_jwt = false

# Travel Desk ticket / bill extraction. verify_jwt = true, unlike extract-card:
# every caller here is a signed-in portal user filling a form, not the mobile app
# calling with the anon key. Same reasoning as parse-resume.
[functions.extract-travel-doc]
verify_jwt = true
